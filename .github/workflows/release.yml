name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Run tests
        run: go test ./... -v

  verify:
    name: Verify Go module
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Wait for Go proxy sync
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "⏳ 等待 Go proxy 同步..."
          sleep 30
          for i in {1..10}; do
            if go list -m -versions github.com/mldong/jeeflow-go 2>&1 | grep -q "$VERSION"; then
              echo "✅ Go module github.com/mldong/jeeflow-go@$VERSION 已可用"
              exit 0
            fi
            echo "   等待中... ($i/10)"
            sleep 15
          done
          echo "❌ Go module 验证超时"
          exit 1
  # Go 无需 publish job——tag 即发布，go get 直接拉 GitHub
